name: Validate Venture revision

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/assemble_venture_natural.py
      - scripts/assemble_venture_natural_final.py
      - projects/literary/EIC/manuscript-editorial/**
      - projects/literary/EIC/editorial/**

permissions:
  contents: read

jobs:
  assemble-and-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assemble revised Book One
        run: python3 scripts/assemble_venture_natural_final.py

      - name: Show QC
        run: cat projects/literary/EIC/assembled/the-venture-natural-qc.md

      - name: Upload assembled manuscript and QC
        uses: actions/upload-artifact@v4
        with:
          name: venture-natural-revision
          path: |
            projects/literary/EIC/assembled/the-venture-natural-revision.md
            projects/literary/EIC/assembled/the-venture-natural-qc.md
          if-no-files-found: error
